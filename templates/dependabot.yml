# Copy to .github/dependabot.yml; see engineering's docs/dependencies.md.
# Keep one entry per package ecosystem in the repository and delete the rest.
# List every separate lockfile directory, such as a firmwares/ Cargo workspace.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  # pnpm workspaces use the npm ecosystem from the directory holding the lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # At least pnpm's minimumReleaseAge, or the frozen install rejects the update.
    # zizmor requires at least seven days.
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: cargo
    directories: [/]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
