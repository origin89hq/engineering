# Copy to .github/workflows/ocr-review.yml; see engineering's docs/code-review.md.
name: Open Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Pin a reviewed engineering commit; this job passes the secret to that code.
    uses: origin89hq/engineering/.github/workflows/ocr-review.yml@ENGINEERING_COMMIT_SHA
    secrets:
      OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
