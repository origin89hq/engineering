name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write
  actions: read

jobs:
  claude-review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Load shared engineering skills
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: origin89hq/engineering
          ref: main
          path: .origin89/engineering
          sparse-checkout: skills
          persist-credentials: false
      - uses: anthropics/claude-code-action@19dda84776b3518d98b8798e591daee763049ed3 # v1.0.220
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          settings: '{"attribution":{"commit":"","pr":""}}'
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Keep read/comment grants for the whole run, including plugin reviewers.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(gh run view:*)"
            --append-system-prompt "Review the requested PR against AGENTS.md, CLAUDE.md, and applicable local instructions.
            Shared skills are already checked out in .origin89/engineering/skills; do not run just skills-sync in this job.
            Read origin89-working/SKILL.md, origin89-review/SKILL.md, origin89-commits/SKILL.md, origin89-testing/SKILL.md, and origin89-writing/SKILL.md there, then the domain skills relevant to the diff.
            Give any review subagents these paths and the same review scope. For a standards finding, identify the applicable rule and explain the concrete consequence.
            This workflow authorizes review comments only. Do not edit code, commit, push, approve, merge, deploy, publish, or operate equipment.
            The test toolchain is not installed here. Inspect CI results for the actual PR head, and distinguish passed, failed, pending, and unavailable checks. Do not run the project's checks or claim unperformed validation.
            Do not repeat existing findings unless new evidence changes them. Leave formatting and commit-metadata checks to CI. Write each comment paragraph on one physical line."
