# Merge these checks into existing CI when the repository already has a package job.
name: origin89-check

on:
  push:
  pull_request:
  # GITHUB_TOKEN-created release PRs do not trigger pull_request workflows.
  # Select changeset-release/<default-branch> to check a generated release PR.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Validate pending changesets
        if: hashFiles('.changeset/*.md', '!.changeset/README.md') != ''
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git show-ref --verify --quiet "refs/heads/$BASE_BRANCH" || git branch --no-track "$BASE_BRANCH" "origin/$BASE_BRANCH"
          pnpm changeset status
      - run: pnpm check
      - run: git diff --exit-code
      - run: pnpm pack --dry-run
